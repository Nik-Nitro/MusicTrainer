name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Setup Android SDK (correct structure)
      run: |
        # Создаём структуру для Android SDK
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk
        
        # Скачиваем старую версию commandlinetools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d /tmp/
        
        # Buildozer ожидает структуру: android-sdk/tools/bin/sdkmanager
        # Или android-sdk/cmdline-tools/latest/bin/sdkmanager
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools
        cp -r /tmp/cmdline-tools/* /home/runner/.buildozer/android/platform/android-sdk/tools/
        
        # Добавляем в PATH
        export PATH=$PATH:/home/runner/.buildozer/android/platform/android-sdk/tools/bin
        
        # Принимаем лицензии
        yes | sdkmanager --licenses || true
        
        # Устанавливаем необходимые компоненты
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;33.0.2"

    - name: Build APK
      run: |
        export PATH=$PATH:/home/runner/.buildozer/android/platform/android-sdk/tools/bin
        buildozer android debug deploy

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicTrainer-v17.5
        path: bin/*.apk
        if-no-files-found: error
