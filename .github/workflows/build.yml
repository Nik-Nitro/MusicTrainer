name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project files if needed
        run: |
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "📦 Распаковываем $zipfile..."
              unzip -o "$zipfile" -d ./
              rm "$zipfile"
              echo "✅ Архив распакован"
            fi
          done
          if [ -f "main.py" ]; then
            echo "✅ main.py найден!"
          else
            echo "⚠️ main.py не найден"
            exit 1
          fi

      - name: Build Docker image
        run: |
          docker build -t builder .

      - name: Clean p4a cache
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            --user root \
            builder bash -c "
              chown -R builder:builder /app
              chmod -R 755 /app
              su builder -c '
                echo \"=== Очищаем кэш p4a ===\"
                rm -rf /home/builder/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/
                rm -rf /home/builder/.buildozer/android/packages/
                echo \"✅ Кэш p4a очищен\"
              '
            "

      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            --user root \
            -e USE_X11=0 \
            -e KIVY_GL_BACKEND=sdl2 \
            -e KIVY_NO_X11=1 \
            -e KIVY_USE_X11=0 \
            builder bash -c "
              chown -R builder:builder /app
              chmod -R 755 /app
              su builder -c '
                cd /app
                rm -rf .buildozer/ bin/
                echo \"=== Starting build ===\"
                buildozer android debug --verbose 2>&1 | tee build.log
                
                echo \"=== Проверяем APK ===\"
                ls -la bin/
                if [ -f bin/*.apk ]; then
                  echo \"=== Проверяем содержимое APK ===\"
                  unzip -l bin/*.apk | grep -E \"kivy|numpy|pygame|SDL2\" | head -20
                fi
              '
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musictrainer-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
