name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t builder .

      - name: Aggressively remove X11 files from Kivy source
        run: |
          docker run --rm -v "$PWD:/app" -w /app builder sh -c "
            echo '=== AGGRESSIVE X11 REMOVAL ==='
            
            # Ищем и удаляем все X11 файлы в исходниках Kivy
            find .buildozer -path '*/kivy/*' -name '*x11*' -type f -delete -print 2>/dev/null || true
            
            # Создаём заглушки
            find .buildozer -path '*/kivy/core/window' -type d 2>/dev/null | while read dir; do
              echo \"Creating dummy in: \$dir\"
              echo '# Dummy file to prevent X11 compilation' > \"\$dir/window_x11.pyx\"
            done
            
            echo '✅ X11 files removed from source'
          "

      - name: Build APK with Docker
        run: |
          docker run --rm -v "$PWD:/app" -w /app --user root builder sh -c "
            chown -R builder:builder /app && 
            su builder -c 'buildozer android debug deploy run'
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musictrainer-apk
          path: bin/*.apk
