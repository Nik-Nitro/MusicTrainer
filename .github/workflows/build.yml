name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build APK
      uses: digreatbrian/buildozer-action@v1
      with:
        command: buildozer android debug deploy

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicTrainer-action
        path: bin/*.apk
