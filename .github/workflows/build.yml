name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      env:
        PACKAGES_PATH: /github/home/.buildozer/android/packages
        ANDROIDSDK: /github/home/.buildozer/android/platform/android-sdk
        ANDROIDNDK: /github/home/.buildozer/android/platform/android-ndk-r23b
        ANDROIDAPI: 31
        ANDROIDMINAPI: 21

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build APK
      run: |
        yes | buildozer -v android debug deploy

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicTrainer-v17.5
        path: bin/*.apk
        if-no-files-found: error
