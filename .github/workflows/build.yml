name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t builder .

      - name: Check Python path
        run: |
          docker run --rm -v "$PWD:/app" -w /app builder sh -c "which python3 && python3 -c 'import sys; print(sys.executable)'"

      - name: Build APK with Docker
        run: |
          docker run --rm -v "$PWD:/app" -w /app --user root builder sh -c "chown -R builder:builder /app && su builder -c 'buildozer android debug deploy run'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musictrainer-apk
          path: bin/*.apk
