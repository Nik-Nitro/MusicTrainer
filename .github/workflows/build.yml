name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04
    
    env:
      USE_X11: 0
      KIVY_GL_BACKEND: sdl2
      KIVY_NO_X11: 1
      KIVY_USE_X11: 0
      HOSTPYTHON: /usr/local/bin/python3
      HOSTPYTHON_VERSION: 3.11

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl make \
            default-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libgl1-mesa-dev \
            portaudio19-dev \
            libblas-dev liblapack-dev gfortran \
            patchelf \
            ninja-build
          
          # Настройка Git для больших файлов
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0 \
                      setuptools==69.5.1 \
                      wheel==0.43.0 \
                      python-for-android==2024.01.21 \
                      meson==1.4.0 \
                      cython==0.29.37

      - name: Verify Python version
        run: |
          python3 --version
          python3 -c "import sys; print(f'Python {sys.version}')"

      - name: Build with Buildozer
        run: |
          buildozer -v android debug deploy run
        env:
          USE_X11: 0
          KIVY_GL_BACKEND: sdl2
          KIVY_NO_X11: 1
          KIVY_USE_X11: 0

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musictrainer-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
