name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project files if needed
        run: |
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "📦 Распаковываем $zipfile..."
              unzip -o "$zipfile" -d ./
              rm "$zipfile"
              echo "✅ Архив распакован"
            fi
          done
          if [ -f "main.py" ]; then
            echo "✅ main.py найден!"
          else
            echo "⚠️ main.py не найден, но может быть в распакованном архиве"
          fi

      - name: Build Docker image
        run: |
          docker build -t builder .

      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            --user root \
            -e USE_X11=0 \
            -e KIVY_GL_BACKEND=sdl2 \
            -e KIVY_NO_X11=1 \
            -e KIVY_USE_X11=0 \
            builder bash -c "
              chown -R builder:builder /app
              chmod -R 755 /app
              
              # Принимаем лицензии SDK и устанавливаем build-tools
              su builder -c '
                echo \"=== Принимаем лицензии SDK ===\"
                export ANDROID_HOME=/home/builder/.buildozer/android/platform/android-sdk
                export PATH=\$PATH:\$ANDROID_HOME/cmdline-tools/latest/bin:\$ANDROID_HOME/platform-tools
                
                # Принимаем лицензии
                yes | sdkmanager --licenses || true
                
                # Устанавливаем build-tools
                echo \"=== Устанавливаем build-tools ===\"
                sdkmanager \"build-tools;33.0.2\" || true
                sdkmanager \"platforms;android-30\" || true
              '
              
              cd /app
              rm -rf .buildozer/ bin/
              echo \"=== Starting build ===\"
              su builder -c '
                cd /app
                export USE_X11=0
                export KIVY_GL_BACKEND=sdl2
                export KIVY_NO_X11=1
                export KIVY_USE_X11=0
                buildozer android debug --verbose 2>&1 | tee build.log
              '
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musictrainer-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
