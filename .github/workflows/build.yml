name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t builder .

      - name: Create config files
        run: |
          cat > buildozer.spec << 'EOFSPEC'
          [app]
          
          title = MusicTrainer
          package.name = musictrainer
          package.domain = org.niknitro
          version = 17.5
          
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,md
          source.exclude_exts = spec,db,pyc,pyo
          source.exclude_dirs = tests, __pycache__, .git, .buildozer, to_delete_backup
          source.include_patterns = data/*, exercises/*, screens/*, core/*, ui/*
          
          requirements = python3==3.11,kivy==2.1.0,pygame==2.6.1,numpy
          
          hostpython3 = /usr/local/bin/python3.11
          
          p4a.local_recipes = ./p4a-recipes
          ignore_setup_py = True
          
          orientation = portrait
          
          android.permissions = INTERNET, VIBRATE, RECORD_AUDIO, MODIFY_AUDIO_SETTINGS
          android.api = 30
          android.minapi = 24
          android.ndk_api = 24
          android.sdk = 33
          android.ndk = 23c
          android.build_tools = 33.0.2
          android.archs = arm64-v8a
          android.enable_androidx = True
          android.auto_sign = True
          android.accept_sdk_license = True
          
          [buildozer]
          
          log_level = 2
          build_dir = ./.buildozer
          bin_dir = ./bin
          EOFSPEC
          
          cat > setup.py << 'EOFPY'
          import os
          os.environ['USE_X11'] = '0'
          os.environ['KIVY_GL_BACKEND'] = 'sdl2'
          os.environ['KIVY_NO_X11'] = '1'
          os.environ['KIVY_USE_X11'] = '0'
          from setuptools import setup
          setup()
          EOFPY
          
          mkdir -p p4a-recipes/kivy
          cat > p4a-recipes/kivy/__init__.py << 'EOFRECIPE'
          from pythonforandroid.recipe import PythonRecipe
          import os
          
          class KivyRecipe(PythonRecipe):
              version = '2.1.0'
              url = 'https://github.com/kivy/kivy/archive/{version}.tar.gz'
              
              def get_recipe_env(self, arch):
                  env = super().get_recipe_env(arch)
                  env['USE_X11'] = '0'
                  env['KIVY_GL_BACKEND'] = 'sdl2'
                  env['KIVY_NO_X11'] = '1'
                  env['KIVY_USE_X11'] = '0'
                  env['CFLAGS'] = env.get('CFLAGS', '') + ' -DKIVY_NO_X11 -DUSE_X11=0'
                  return env
              
              def build_arch(self, arch):
                  build_dir = self.get_build_dir(arch.arch)
                  setup_path = f'{build_dir}/setup.py'
                  if os.path.exists(setup_path):
                      with open(setup_path, 'r') as f:
                          content = f.read()
                      patch = '''
          import os
          os.environ['USE_X11'] = '0'
          os.environ['KIVY_GL_BACKEND'] = 'sdl2'
          os.environ['KIVY_NO_X11'] = '1'
          os.environ['KIVY_USE_X11'] = '0'
          '''
                      with open(setup_path, 'w') as f:
                          f.write(patch + content)
                  super().build_arch(arch)
          
          recipe = KivyRecipe()
          EOFRECIPE

      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            --user builder \
            -e USE_X11=0 \
            -e KIVY_GL_BACKEND=sdl2 \
            -e KIVY_NO_X11=1 \
            -e KIVY_USE_X11=0 \
            builder bash -c "
              rm -rf .buildozer/ bin/
              echo '=== Checking files ==='
              ls -la buildozer.spec setup.py p4a-recipes/kivy/__init__.py
              buildozer android debug --verbose 2>&1 | tee build.log
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musictrainer-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
