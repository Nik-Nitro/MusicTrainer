name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer

    - name: Build APK
      run: |
        # Устанавливаем переменную для автоматического принятия лицензий
        export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
        export ANDROID_NDK_ROOT=/home/runner/.buildozer/android/platform/android-ndk
        
        # Buildozer сам скачает и установит всё необходимое
        # Принимаем все лицензии через yes
        yes | buildozer android debug deploy || true
        
        # Если сборка упала из-за лицензий, пробуем ещё раз с уже принятыми
        buildozer android debug deploy

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicTrainer-v17.5
        path: bin/*.apk
